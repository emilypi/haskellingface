campaign:
  name: huggingface
  plan: logs/2026-10-14-huggingface-plan
  mode: solo
packages:
  - id: p7
    name: Simplify implementation modules and expose the whole library
    kind: build
    depends_on: [p6]
    isolation: in-place
    scope: {files: [src/**, test/**, huggingface.cabal, README.md, CHANGELOG.md, AGENTS.md]}
    tests_first: [exposed transport and utils, smart constructor boundaries, existing offline contracts]
    verify:
      - {cmd: scripts/validate.sh, expect: exit 0}
  - id: p6
    name: Domain module boundaries
    kind: build
    depends_on: [p5]
    isolation: in-place
    scope: {files: [src/**, test/**, huggingface.cabal, README.md, CHANGELOG.md]}
    tests_first: [focused public imports, opaque constructors, existing HTTP and parser contracts]
    verify:
      - {cmd: scripts/validate.sh, expect: exit 0}
  - id: p5
    name: Parsec grammars
    kind: build
    depends_on: [p4]
    isolation: in-place
    scope: {files: [src/**, test/**, huggingface.cabal, README.md, CHANGELOG.md]}
    tests_first: [complete consumption, ambiguous prefixes, grammar boundaries, quoted Link parameters]
    verify:
      - {cmd: scripts/validate.sh, expect: exit 0}
  - id: p4
    name: Parse domain values at boundaries
    kind: build
    depends_on: [p1, p2, p3]
    isolation: in-place
    scope: {files: [src/**, test/**, examples/**, README.md, CHANGELOG.md]}
    tests_first: [parser round trips, malformed JSON domain values, typed output reuse]
    verify:
      - {cmd: scripts/validate.sh, expect: exit 0}
  - id: p1
    name: Library and offline integration tests
    kind: build
    depends_on: []
    weight: large
    isolation: in-place
    scope: {files: [src/**, test/**, huggingface.cabal]}
    contracts: [c-client, c-errors, c-pagination, c-download, c-inference]
    skills: [/testing-patterns]
    log: logs/2026-10-14-huggingface-plan/STATUS.md
    tests_first: [identifier boundaries, exact HTTP requests, redirect credential isolation, JSON failures]
    verify:
      - {cmd: 'cabal test all --test-show-details=direct --ghc-options=-Werror', expect: exit 0}
  - id: p2
    name: Distribution and documentation
    kind: build
    depends_on: [p1]
    weight: medium
    isolation: in-place
    scope: {files: [README.md, CHANGELOG.md, CONTRIBUTING.md, examples/**, .github/**, scripts/**, default.nix]}
    skills: [/tech-ref-git]
    log: logs/2026-10-14-huggingface-plan/STATUS.md
    verify:
      - {cmd: scripts/validate.sh, expect: exit 0}
  - id: p3
    name: Credential and input handling review
    kind: audit
    depends_on: [p2]
    weight: small
    isolation: read-only
    scope: {files: [src/**, test/**]}
    skills: [/tech-ref-api-security]
    log: logs/2026-10-14-huggingface-plan/security.md
    coverage: [credential redaction, redirect and pagination origins, input validation, callback and response lifetime]
    min_confidence: confirmed
